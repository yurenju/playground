<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="../icon.png" />

    <!-- Probe B: one unconditioned tag against a manifest that names a different colour. This is
         the exact shape Tidemarks has, with the media tags of probe 1 taken out of the way. -->
    <meta name="theme-color" content="#8800cc" />

    <title>probe B — manifest vs one plain tag</title>
    <style>
      body {
        margin: 0;
        padding: 1.25rem 1.25rem 3rem;
        font: 16px/1.6 system-ui, sans-serif;
        background: #222;
        color: #eee;
      }
      h1 {
        font-size: 1.3rem;
      }
      button {
        font: inherit;
        padding: 0.8rem 1rem;
        margin: 0.25rem 0.25rem 0 0;
        background: #555;
        color: #fff;
        border: 1px solid #888;
        border-radius: 6px;
      }
      pre {
        background: #000;
        padding: 0.6rem;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 0.8rem;
      }
      .key {
        border-collapse: collapse;
        width: 100%;
        margin: 1rem 0;
      }
      .key td {
        border: 1px solid #555;
        padding: 0.5rem;
      }
      .sw {
        display: inline-block;
        width: 2.5em;
        height: 1.4em;
        vertical-align: -0.3em;
        border: 1px solid #999;
      }
    </style>
  </head>
  <body>
    <h1>Probe B</h1>
    <p>manifest says <b>green</b>. The page's one plain theme-color tag says <b>purple</b>.</p>

    <table class="key">
      <tr>
        <td><span class="sw" style="background: #00cc44"></span></td>
        <td>green — the <b>manifest</b> won</td>
      </tr>
      <tr>
        <td><span class="sw" style="background: #8800cc"></span></td>
        <td>purple — the <b>meta tag</b> won</td>
      </tr>
      <tr>
        <td><span class="sw" style="background: #ff7700"></span></td>
        <td>orange — a <b>runtime write</b> won</td>
      </tr>
    </table>

    <button onclick="paint('#ff7700')">Write orange into the tag</button>
    <button onclick="location.reload()">Reload</button>
    <pre id="state"></pre>

    <script>
      const tag = document.querySelector('meta[name="theme-color"]');
      const show = () =>
        (document.getElementById("state").textContent = [
          `standalone: ${matchMedia("(display-mode: standalone)").matches}`,
          `system dark: ${matchMedia("(prefers-color-scheme: dark)").matches}`,
          `theme-color now: ${tag.content}`,
          ``,
          navigator.userAgent,
        ].join("\n"));
      const paint = (c) => {
        tag.content = c;
        show();
      };
      show();
      navigator.serviceWorker?.register("sw.js");
    </script>
  </body>
</html>
