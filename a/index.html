<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="../icon.png" />

    <!-- Probe A: one unconditioned tag, and a manifest with NO theme_color at all. If the bar
         is purple here, the manifest's presence is what was suppressing the tag in probe 1. -->
    <meta name="theme-color" content="#8800cc" />

    <title>probe A — no manifest theme_color</title>
    <style>
      body {
        margin: 0;
        padding: 1.25rem;
        font: 16px/1.5 system-ui, sans-serif;
        background: #222;
        color: #eee;
      }
      button {
        font: inherit;
        padding: 0.7rem 1rem;
        margin: 0.25rem 0.25rem 0 0;
        background: #00aa44;
        color: #fff;
        border: 0;
        border-radius: 6px;
      }
      pre {
        background: #000;
        padding: 0.6rem;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 0.8rem;
      }
      b {
        color: #ffee88;
      }
    </style>
  </head>
  <body>
    <h1>Probe A</h1>
    <p>
      Manifest has <b>no theme_color</b>. One plain <code>theme-color</code> tag, purple
      <b>#8800cc</b>.
    </p>
    <p>
      Bar purple → the tag works, and probe 1's manifest was overriding it.<br />
      Bar grey/black/white → the tag is ignored here too.
    </p>
    <button onclick="paint('#00aa44')">Make it green</button>
    <button onclick="location.reload()">Reload</button>
    <pre id="state"></pre>
    <script>
      const show = () =>
        (document.getElementById("state").textContent = [
          `standalone: ${matchMedia("(display-mode: standalone)").matches}`,
          `system dark: ${matchMedia("(prefers-color-scheme: dark)").matches}`,
          `theme-color now: ${document.querySelector('meta[name="theme-color"]').content}`,
          ``,
          navigator.userAgent,
        ].join("\n"));
      const paint = (c) => {
        document.querySelector('meta[name="theme-color"]').content = c;
        show();
      };
      show();
      navigator.serviceWorker?.register("sw.js");
    </script>
  </body>
</html>
